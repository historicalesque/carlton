<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Common Ground - Submission review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAFAF8;
    --paper-raised: #F1F0EB;
    --ink: #1B1E23;
    --ink-soft: #565C66;
    --line: #DAD8D0;
    --slate: #3E4C59;
    --add-bg: #E4EFE7;
    --add-text: #1F5138;
    --del-bg: #F5E6E3;
    --del-text: #7A2E20;
    --serif: 'Lora', Georgia, serif;
    --sans: 'IBM Plex Sans', -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  a { color: var(--slate); }
  a:focus-visible, button:focus-visible, .btn:focus-visible { outline: 2px solid var(--slate); outline-offset: 3px; border-radius: 2px; }
  header {
    padding: 28px 40px 20px; border-bottom: 1px solid var(--line);
    max-width: 900px; margin: 0 auto;
  }
  header h1 { font-family: var(--serif); font-weight: 500; font-size: 1.5rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--ink-soft); font-size: 0.9rem; }
  main { max-width: 900px; margin: 0 auto; padding: 32px 40px 80px; }

  button, .btn {
    font-family: var(--sans); font-size: 0.9rem; font-weight: 500;
    border-radius: 4px; border: 1px solid var(--line); background: var(--paper);
    color: var(--ink); padding: 9px 16px; cursor: pointer; text-decoration: none;
    display: inline-block;
  }
  button:hover, .btn:hover { border-color: var(--slate); }
  .btn.primary { background: var(--slate); border-color: var(--slate); color: var(--paper); }
  .btn.primary:hover { background: var(--ink); border-color: var(--ink); }
  .btn.ghost { border: none; background: none; padding: 0; text-decoration: underline; text-underline-offset: 3px; }

  .empty, .error {
    color: var(--ink-soft); border: 1px dashed var(--line); border-radius: 6px;
    padding: 28px; font-size: 0.95rem;
  }
  .error { border-color: var(--del-text); color: var(--del-text); border-style: solid; background: var(--del-bg); }

  .pr-row {
    display: flex; justify-content: space-between; align-items: center; gap: 20px;
    padding: 18px 0; border-bottom: 1px solid var(--line);
  }
  .pr-row:first-child { padding-top: 0; }
  .pr-row .title { font-family: var(--serif); font-size: 1.1rem; margin: 0 0 4px; }
  .pr-row .meta { font-size: 0.85rem; color: var(--ink-soft); }

  .back-link { display: inline-block; margin-bottom: 20px; font-size: 0.9rem; }

  .file-block { border: 1px solid var(--line); border-radius: 6px; margin-bottom: 20px; overflow: hidden; }
  .file-block .file-header {
    background: var(--paper-raised); padding: 12px 16px; font-family: var(--mono);
    font-size: 0.85rem; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .file-header .tag {
    font-family: var(--sans); font-size: 0.75rem; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .preview-frame { width: 100%; height: 600px; border: none; background: #fff; display: block; }

  .spinner-text { color: var(--ink-soft); font-size: 0.9rem; padding: 20px 0; }

  .badge {
    font-family: var(--sans); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    border-radius: 3px; padding: 2px 7px; margin-left: 8px; vertical-align: 2px; white-space: nowrap;
  }
  .badge.new { background: var(--add-bg); color: var(--add-text); }
  .badge.version { background: #E6EAF0; color: var(--slate); }

  .notice {
    border-radius: 6px; padding: 14px 16px; margin: 0 0 20px; font-size: 0.92rem;
    border: 1px solid #C9D3DE; background: #EEF2F6;
  }
  .notice.warn { border-color: #E2CFA0; background: #FBF5E6; }
  .notice p { margin: 0; }
  .notice p + p { margin-top: 6px; }

  .changes { border: 1px solid var(--line); border-radius: 6px; margin-bottom: 20px; overflow: hidden; background: #fff; }
  .changes-header {
    background: var(--paper-raised); padding: 12px 16px; font-size: 0.85rem; font-weight: 600;
    border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center;
  }
  .changes-header .tag { font-size: 0.75rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; }
  .changes table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  .changes th, .changes td { text-align: left; vertical-align: top; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .changes thead th {
    font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft);
    font-weight: 600; background: var(--paper);
  }
  .changes td.field { width: 18%; font-weight: 500; color: var(--ink-soft); }
  .changes td.old, .changes td.new { width: 41%; overflow-wrap: anywhere; }
  .changes ul { margin: 0; padding: 0; list-style: none; }
  .changes li { margin: 0 0 4px; }
  .changes .add { background: var(--add-bg); color: var(--add-text); border-radius: 2px; padding: 0 2px; }
  .changes .del { background: var(--del-bg); color: var(--del-text); border-radius: 2px; padding: 0 2px; text-decoration: line-through; }
  .changes .none { color: var(--ink-soft); font-style: italic; }
  .changes .same { color: var(--ink-soft); }
  .changes .text { font-family: var(--serif); line-height: 1.55; }
  .changes tfoot td { font-size: 0.85rem; color: var(--ink-soft); background: var(--paper); border-bottom: none; }
  .changes .lost { display: block; font-size: 0.78rem; color: var(--del-text); margin-top: 4px; font-family: var(--sans); }
  .cell-label { display: none; }

  .decided-in-sheet {
    margin-top: 24px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper-raised);
  }
  .decided-in-sheet h3 { font-family: var(--serif); font-weight: 500; font-size: 1.1rem; margin: 0 0 6px; }
  .decided-in-sheet p { margin: 0 0 6px; font-size: 0.93rem; max-width: 65ch; }
  .decided-in-sheet p:last-child { margin-bottom: 0; }

  @media (max-width: 640px) {
    header { padding: 24px 16px 16px; }
    main { padding: 24px 16px 60px; }
    .preview-frame { height: 70vh; }
    .changes thead { display: none; }
    .changes tr { display: block; border-bottom: 1px solid var(--line); padding: 6px 0; }
    .changes td { display: block; border: none; width: auto !important; padding: 4px 14px; }
    .changes td.field { padding-top: 8px; }
    .changes tfoot tr { border-bottom: none; }
    .cell-label {
      display: block; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--ink-soft); margin-bottom: 2px; font-family: var(--sans);
    }
  }
</style>
</head>
<body>

<header>
  <h1>Submission review</h1>
  <p>Entries sent in through the contribution form. Anyone can read them here; the editors accept or reject each one. <a href="./">Admin</a> &middot; <a href="../">Back to the site</a></p>
</header>

<main id="app"></main>

<script src="../scripts/tei-compare.js"></script>
<script>
/* ============================== CONFIG ============================== */
const CONFIG = {
  REPO_OWNER: "historicalesque",
  REPO_NAME: "carlton",
  XML_PATH_PREFIX: "civic/",   // only PRs touching files under this path are shown
  BASE_BRANCH: "main",         // what is on the site now, for the before/after table
};
/* ===================================================================== */

const API = "https://api.github.com";
const RAW = "https://raw.githubusercontent.com";
const $app = document.getElementById("app");

async function ghApi(path) {
  const res = await fetch(API + path);
  if (res.status === 403) {
    const remaining = res.headers.get("x-ratelimit-remaining");
    if (remaining === "0") {
      const reset = new Date(Number(res.headers.get("x-ratelimit-reset")) * 1000);
      throw new Error(`GitHub is temporarily limiting requests from this network. Try again after ${reset.toLocaleTimeString()}.`);
    }
  }
  if (!res.ok) throw new Error(`GitHub API error (${res.status})`);
  return res.json();
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ------------------------------ Views ------------------------------ */

function rawUrl(ref, path) {
  return `${RAW}/${CONFIG.REPO_OWNER}/${CONFIG.REPO_NAME}/${ref}/${path}`;
}

async function fetchText(url) {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error(`Could not load ${url.split("/").pop()} (${res.status})`);
  return res.text();
}

// The Apps Script writes "Submitted through the contribution form by …" in the pull request
function senderOf(pr) {
  const m = (pr.body || "").match(/contribution form by (.+?)\.\s*$/m);
  return m ? m[1].trim() : "";
}

function sentLine(pr) {
  const who = senderOf(pr);
  return `Sent ${timeAgo(pr.created_at)}${who ? ` by ${escapeHtml(who)}` : ""}`;
}

// A file the pull request changes (rather than adds) is a new version of an existing entry
const isNewVersion = (xmlFiles) => xmlFiles.some((f) => f.status === "modified");
const badge = (xmlFiles) => isNewVersion(xmlFiles)
  ? `<span class="badge version">Changes an entry</span>`
  : `<span class="badge new">New entry</span>`;

// "New entry: Corkman Hotel" → "Corkman Hotel"
const entryTitle = (pr) => pr.title.replace(/^(New entry|New version of|Contribution to):\s*/i, "");

async function render() {
  const params = new URLSearchParams(window.location.search);
  const prNumber = params.get("pr");
  try {
    if (prNumber) await renderPrDetail(Number(prNumber), params.get("v"));
    else await renderPrList();
  } catch (e) {
    $app.innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
  }
}

async function renderPrList() {
  $app.innerHTML = `<p class="spinner-text">Loading submissions&hellip;</p>`;
  const prs = await ghApi(`/repos/${CONFIG.REPO_OWNER}/${CONFIG.REPO_NAME}/pulls?state=open&per_page=50`);

  const withXmlFiles = [];
  for (const pr of prs) {
    const files = await ghApi(`/repos/${CONFIG.REPO_OWNER}/${CONFIG.REPO_NAME}/pulls/${pr.number}/files?per_page=100`);
    const xmlFiles = files.filter((f) => f.filename.startsWith(CONFIG.XML_PATH_PREFIX) && f.filename.endsWith(".xml"));
    if (xmlFiles.length) withXmlFiles.push({ pr, xmlFiles });
  }

  if (!withXmlFiles.length) {
    $app.innerHTML = `<div class="empty">Nothing waiting right now. New submissions will show up here. Refresh to check again.</div>
      <button style="margin-top:16px;" onclick="render()">Refresh</button>`;
    return;
  }

  $app.innerHTML = `
    <div style="margin-bottom:16px;"><button onclick="render()">Refresh</button></div>
    ${withXmlFiles.map(({ pr, xmlFiles }) => `
      <div class="pr-row">
        <div>
          <p class="title">${escapeHtml(entryTitle(pr))}${badge(xmlFiles)}</p>
          <p class="meta">${sentLine(pr)}</p>
        </div>
        <button data-pr="${pr.number}">Review</button>
      </div>
    `).join("")}
  `;

  $app.querySelectorAll("button[data-pr]").forEach((btn) => {
    btn.onclick = () => {
      const u = new URL(window.location.href);
      u.searchParams.set("pr", btn.dataset.pr);
      history.pushState({}, "", u);
      render();
    };
  });
}

// version: a commit on the submission's branch (?v=…), for a link to one exact
// version; otherwise the latest.
async function renderPrDetail(prNumber, version) {
  $app.innerHTML = `<p class="spinner-text">Loading&hellip;</p>`;
  const repoPath = `/repos/${CONFIG.REPO_OWNER}/${CONFIG.REPO_NAME}`;
  const pr = await ghApi(`${repoPath}/pulls/${prNumber}`);
  const files = await ghApi(`${repoPath}/pulls/${prNumber}/files?per_page=100`);
  const xmlFiles = files.filter((f) => f.filename.startsWith(CONFIG.XML_PATH_PREFIX) && f.filename.endsWith(".xml"));
  const ref = version && /^[0-9a-f]{7,40}$/i.test(version) ? version : pr.head.sha;
  const closed = pr.merged_at ? "This submission has been accepted and is on the site."
    : pr.state === "closed" ? "This submission was turned down." : "";

  $app.innerHTML = `
    <a class="back-link ghost btn" href="javascript:void(0)" id="back">&larr; All submissions</a>
    <h2 style="font-family: var(--serif); font-weight: 500; margin-bottom: 4px;">${escapeHtml(entryTitle(pr))}${badge(xmlFiles)}</h2>
    <p class="meta" style="color: var(--ink-soft); margin-top: 0;">${sentLine(pr)}</p>
    ${closed ? `<div class="notice"><p>${closed}</p></div>` : ""}
    <div id="files"></div>
    ${closed ? "" : `
    <section class="decided-in-sheet">
      <h3>Accepting or rejecting</h3>
      <p>The editors decide in the team's submissions spreadsheet: find this entry's row and pick <strong>Accept</strong> or <strong>Reject</strong> in the <strong>Decision</strong> column. It happens about a minute later, and the entry appears on the site a minute or two after that.</p>
      <p>Changed your mind within the minute? Clear the Decision cell to cancel.</p>
    </section>`}
  `;
  document.getElementById("back").onclick = () => {
    const u = new URL(window.location.href);
    u.searchParams.delete("pr");
    u.searchParams.delete("v");
    history.pushState({}, "", u);
    render();
  };

  const $files = document.getElementById("files");
  for (const f of xmlFiles) {
    const block = document.createElement("div");
    $files.appendChild(block);
    loadFile(block, f, ref);
  }
}

async function loadFile(block, file, ref) {
  const previewUrl = `https://${CONFIG.REPO_OWNER}.github.io/${CONFIG.REPO_NAME}/civic?id=${encodeURIComponent(rawUrl(ref, file.filename))}&preview=true`;
  const title = file.filename.slice(CONFIG.XML_PATH_PREFIX.length).replace(/\.xml$/, "").replace(/-/g, " ");
  const preview = `
    <div class="file-block">
      <div class="file-header">
        <span>${escapeHtml(title)}</span>
        <span class="tag">${file.status === "modified" ? "Preview of this version" : "Preview"}</span>
      </div>
      <iframe src="${previewUrl}" class="preview-frame" title="${escapeHtml(title)} preview"></iframe>
    </div>`;

  if (file.status !== "modified") {
    block.innerHTML = preview;
    return;
  }

  // A new version of an entry that is already on the site: show what would change
  // The comparison goes above the preview, without reloading the preview frame
  block.innerHTML = `<div class="compare"><p class="spinner-text">Comparing with the entry on the site&hellip;</p></div>${preview}`;
  let compare;
  try {
    const [current, submitted] = await Promise.all([
      fetchText(rawUrl(CONFIG.BASE_BRANCH, file.filename)),
      fetchText(rawUrl(ref, file.filename))
    ]);
    const result = TEICompare.table(current, submitted);
    compare = `
      <div class="notice warn">
        <p><strong>This is a new version of an entry that is already on the site.</strong> If the editors accept it, it replaces the current entry.</p>
        ${result.lost ? `<p>${result.lost} thing${result.lost === 1 ? " is" : "s are"} left out of the new version and would disappear from the site. They are marked below.</p>` : ""}
      </div>
      ${result.html}`;
  } catch (e) {
    compare = `<div class="error">Could not compare with the entry on the site: ${escapeHtml(e.message)}</div>`;
  }
  block.querySelector(".compare").innerHTML = compare;
}

function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const days = Math.floor(diff / 86400000);
  if (days === 0) return "today";
  if (days === 1) return "yesterday";
  if (days < 30) return `${days} days ago`;
  const months = Math.floor(days / 30);
  return `${months} month${months > 1 ? "s" : ""} ago`;
}

window.addEventListener("popstate", render);
render();
</script>
</body>
</html>

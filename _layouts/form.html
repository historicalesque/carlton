<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Common Ground - Contribution form</title>
  
  <!-- Directory data loader: fetches only the files holding this entry's records -->
  <script src="scripts/data.js?v={{ site.time | date: '%s' }}"></script>

  <!-- Quill WYSIWYG Editor Styles -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

  <!-- Site fonts and stylesheet, for the palette tokens (--paper, --ink, --moss…) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="styles/site.css?v={{ site.time | date: '%s' }}">

  <!-- This page is shown inside an iframe on entry pages (_layouts/entry.html),
       inside the "Contribute" box, so it has no card or background of its own. -->
  <style>
    body {
      background: transparent;
      color: var(--ink-soft);
    }
    .form-card {
      max-width: 700px;
    }
    h2 {
      font-family: var(--font-serif);
      font-weight: normal;
      color: var(--ink);
      font-size: 1.25rem;
      margin-bottom: 6px;
    }
    .form-intro {
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    /* --- Directory record(s) this entry is about --- */
    .entity-container {
      margin-bottom: 24px;
    }
    .entity-card {
      background-color: var(--paper);
      border: 1px solid var(--paper-line);
      border-left: 3px solid var(--moss);
      padding: 12px 16px;
      margin-bottom: 12px;
    }
    .entity-card h3 {
      font-family: var(--font-serif);
      font-weight: normal;
      font-size: 1rem;
      color: var(--ink);
      margin-bottom: 6px;
    }
    .entity-card ul {
      list-style-type: none;
    }
    .entity-card li {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--ink);
      padding: 4px 0;
      border-bottom: 1px dashed var(--paper-line);
      overflow-wrap: anywhere;
    }
    .entity-card li:last-child {
      border-bottom: none;
    }
    .entity-card .prop-key {
      font-family: var(--font-ui);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-faint);
      margin-right: 4px;
    }

    /* --- Fields: same look as the "Suggest new article" form (new.html) --- */
    .field-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--moss);
      margin-bottom: 5px;
    }
    input[type="text"] {
      width: 100%;
      font-family: var(--font-mono);
      font-size: 15px;
      padding: 10px 12px;
      background: var(--paper);
      border: 1px solid var(--ink);
      color: var(--ink);
    }
    input[type="text"]::placeholder {
      color: var(--ink-faint);
    }
    input[type="text"]:focus {
      outline: 2px solid var(--moss);
      outline-offset: 1px;
    }

    /* Quill editor: toolbar and text box share the field border */
    .ql-toolbar.ql-snow,
    .ql-container.ql-snow {
      border-color: var(--ink);
    }
    .ql-toolbar.ql-snow {
      background: var(--paper-deep);
      font-family: var(--font-ui);
    }
    .ql-container.ql-snow {
      background: var(--paper);
      font-family: var(--font-ui);
      font-size: 15px;
      color: var(--ink);
    }
    .ql-container.ql-snow:focus-within {
      outline: 2px solid var(--moss);
      outline-offset: 1px;
    }
    .ql-editor.ql-blank::before {
      color: var(--ink-faint);
      font-style: normal;
    }
    .ql-snow .ql-stroke { stroke: var(--ink-soft); }
    .ql-snow .ql-fill { fill: var(--ink-soft); }
    .ql-snow .ql-picker { color: var(--ink-soft); }
    .ql-snow.ql-toolbar button:hover .ql-stroke,
    .ql-snow.ql-toolbar button.ql-active .ql-stroke,
    .ql-snow .ql-picker-label:hover .ql-stroke { stroke: var(--moss); }
    .ql-snow.ql-toolbar button:hover .ql-fill,
    .ql-snow.ql-toolbar button.ql-active .ql-fill { fill: var(--moss); }
    .ql-snow.ql-toolbar button:hover,
    .ql-snow.ql-toolbar button.ql-active,
    .ql-snow .ql-picker-label:hover,
    .ql-snow .ql-picker-item:hover,
    .ql-snow .ql-picker-item.ql-selected { color: var(--moss); }
    .ql-snow .ql-picker-options { background: var(--paper); }
    .ql-snow .ql-tooltip {
      background: var(--paper);
      border-color: var(--sage-dark);
      color: var(--ink-soft);
      box-shadow: none;
    }
    .ql-snow .ql-tooltip a { color: var(--moss); }
    .ql-editor a { color: var(--moss); }

    #editor-container {
      height: 220px;
    }

    button[type="submit"] {
      font-family: var(--font-mono);
      font-size: 14px;
      padding: 11px 20px;
      background: var(--moss);
      border: 1px solid var(--moss);
      color: var(--paper);
      cursor: pointer;
    }
    button[type="submit"]:hover {
      background: var(--moss-deep);
    }
    button[type="submit"]:disabled {
      background: var(--sage-dark);
      border-color: var(--sage-dark);
      cursor: not-allowed;
    }
    @media (max-width: 480px) {
      button[type="submit"] { width: 100%; }
    }

    #status {
      margin-top: 15px;
      padding: 10px 14px;
      display: none;
      font-size: 14px;
    }
    .success {
      background-color: var(--sage-light);
      color: var(--moss-deep);
      border: 1px solid var(--sage-dark);
    }
    .error {
      background-color: #f6e4dc;
      color: #8a2c1d;
      border: 1px solid #d9a79a;
    }

    .ql-table-embed table {
      border-collapse: collapse;
      width: 100%;
    }
    .ql-table-embed td,
    .ql-table-embed th {
      border: 1px solid var(--paper-line);
      padding: 6px 8px;
    }
  </style>
</head>
<body>

<div class="form-card">
  <!-- Container for dynamically loaded Directory Data -->
  <div id="details-container"></div>

  <h2>Suggest Article contents</h2>
  <p class="form-intro"><i>Instructions go here. Links to editorial guidance, etc. </i></p>
  
  <form id="submissionForm">
    <div class="field-group">
      <label for="authorName">Contributor / Author Name</label>
      <input type="text" id="authorName" placeholder="e.g. Dr. John Smith" required />
    </div>

    <div class="field-group">
      <label for="articleTitle">Proposed Article Title</label>
      <input type="text" id="articleTitle" placeholder="e.g. Princes Bridge" required />
    </div>

    <div class="field-group">
      <label>Proposed Article Content</label>
      <div id="editor-container"></div>
    </div>

    <input type="hidden" id="prefilledId" placeholder="e.g. princes-bridge" />

    <button type="submit" id="submitBtn">Submit Contribution</button>
  </form>

  <div id="status"></div>
</div>

<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

<script>

function cleanEditorHTML(html) {
  return html
    // collapse empty paragraphs like <p><br></p> or <p></p>
    .replace(/<p>(\s*<br\s*\/?>\s*)?<\/p>/gi, '')
    // strip any leftover style attributes Quill format-whitelisting missed
    .replace(/\s*style="[^"]*"/gi, '');
}



  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyTaAc0BbSxGt3DSiXgMfI_XoPrkxt_3rJV8foBasiuoLThA12jkPMUUYj9381gMbedIw/exec";

  // Auto-fill query parameters if present
  const urlParams = new URLSearchParams(window.location.search);
  const targetId = urlParams.get('id');

  if (targetId) document.getElementById('prefilledId').value = targetId;
  if (urlParams.get('title')) document.getElementById('articleTitle').value = urlParams.get('title');

  // --- Dynamic Directory Data Rendering ---
  if (targetId && window.CGData) {
    // Find all records matching the target entityID (comparing both string and number).
    // If the lookup fails the form still works, just without the records.
    CGData.forEntity(targetId).then(showRecords).catch(() => {});
  }

  function showRecords(matchingEntries) {
    if (matchingEntries.length > 0) {
      const detailsContainer = document.getElementById('details-container');
      
      let html = '<div class="entity-container">';
      
      matchingEntries.forEach((entry, index) => {
        html += `<div class="entity-card">`;
        if (matchingEntries.length > 1) {
          html += `<h3>Item #${index + 1}</h3>`;
        }
        html += `<ul>`;
        
        // Loop through whatever key-value pairs are found inside the record
        for (const [key, value] of Object.entries(entry)) {
          if (value !== null && value !== undefined) {
            // Capitalize key name (e.g. "entityID" -> "EntityID", "street" -> "Street")
            const formattedKey = key.charAt(0).toUpperCase() + key.slice(1);
            html += `<li><span class="prop-key">${formattedKey}:</span> ${value}</li>`;
          }
        }
        
        html += `</ul></div>`;
      });

      html += '</div>';
      detailsContainer.innerHTML = html;
    }
  }

// 1. Define a blot that just stores/renders raw HTML as a single atomic block
const BlockEmbed = Quill.import('blots/block/embed');

class TableBlot extends BlockEmbed {
  static create(value) {
    const node = super.create();
    node.innerHTML = value; // the raw pasted table markup
    return node;
  }
  static value(node) {
    return node.innerHTML;
  }
}
TableBlot.blotName = 'tableHTML';
TableBlot.tagName = 'div';
TableBlot.className = 'ql-table-embed';

Quill.register(TableBlot);


const Link = Quill.import('formats/link');

class NoTargetLink extends Link {
  static create(value) {
    const node = super.create(value);
    node.removeAttribute('target');
    node.removeAttribute('rel');
    return node;
  }
}
Quill.register(NoTargetLink, true); // true = force override the built-in 'link' format



// 2. Initialize Quill 
const quill = new Quill('#editor-container', {
  modules: {
    toolbar: [
      [{ 'header': [1, 2, 3, false] }],
      ['bold', 'italic', 'underline'],
      [{ 'list': 'ordered'}, { 'list': 'bullet' }],
      ['link'],
      ['clean']
    ]
  },
  formats: [
    'header', 'bold', 'italic', 'underline',
    'list', 'link', 'tableHTML'
  ],
  placeholder: 'Type or paste the entry content here...',
  theme: 'snow'
});

// 3. Intercept pasted <table> elements before Quill's default handling flattens them
quill.clipboard.addMatcher('table', (node, delta) => {
  const Delta = Quill.import('delta');
  return new Delta().insert({ tableHTML: node.outerHTML });
});

  const form = document.getElementById('submissionForm');
  const submitBtn = document.getElementById('submitBtn');
  const statusDiv = document.getElementById('status');

  form.addEventListener('submit', async function(e) {
    e.preventDefault();

    const authorNameInput = document.getElementById('authorName').value.trim();
    const articleTitleInput = document.getElementById('articleTitle').value.trim();
    const prefilledIdInput = document.getElementById('prefilledId').value.trim();
    const richTextHTML = "<![CDATA[" + cleanEditorHTML(quill.root.innerHTML) + "]]>";
    const plainText = quill.getText().trim();

    // --- Basic Validation ---
    if (!authorNameInput) {
      showStatus("Please enter the Contributor / Author Name.", "error");
      return;
    }

    if (!articleTitleInput) {
      showStatus("Please enter an Article Title.", "error");
      return;
    }

    if (plainText.length === 0) {
      showStatus("Please write some content before submitting.", "error");
      return;
    }

    // --- ID Fallback Logic ---
    const finalId = prefilledIdInput || articleTitleInput;

    const payload = {
      authorName: authorNameInput,
      articleTitle: articleTitleInput,
      prefilledId: finalId,
      articleText: richTextHTML
    };

    submitBtn.disabled = true;
    submitBtn.innerText = "Submitting contribution...";
    statusDiv.style.display = "none";

    try {
      // POST request to Apps Script Web App
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (result.status === "success") {
        showStatus("🎉 Submission received! We'll review it shortly.", "success");
        form.reset();
        quill.setText('');
      } else {
        showStatus("Error: " + result.message, "error");
      }
    } catch (err) {
      showStatus("Submission failed. Please check network connection or let us know if the problem persists.", "error");
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "Submit Contribution";
    }
  });

  function showStatus(text, type) {
    statusDiv.className = type;
    statusDiv.innerText = text;
    statusDiv.style.display = "block";
  }

  // Tell the entry page how tall the form is, so it can size the iframe to fit
  // (see the "contribution-form-height" listener in _layouts/entry.html).
  function reportHeight() {
    if (window.parent === window) return;
    window.parent.postMessage({
      type: "contribution-form-height",
      height: Math.ceil(document.documentElement.getBoundingClientRect().height)
    }, window.location.origin);
  }
  new ResizeObserver(reportHeight).observe(document.documentElement);
  window.addEventListener("load", reportHeight);
</script>

</body>
</html>

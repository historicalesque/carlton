theme: jekyll-theme-cayman

# The Apps Script web app (/exec URL) that receives contribution form entries
# (apps-script/Code.gs, setup in apps-script/README.md). Leave empty to keep
# the form unconnected: it then only previews and downloads.
contribution_endpoint: "https://script.google.com/macros/s/AKfycbxKYO3HIIwoNWI7ZHyxHvDz9wsvFgQT0KUL3kHgztqtNDaITvjH-uaQiTLEfdGbm2LX/exec"

defaults:
  # Applies to every page unless a more specific rule below overrides it.
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
      overrideCommunityContributionForm: true

  # The civic encyclopedia-entry page: needs the entry layout, XML lookup path,
  # and the contribution form turned on.
  - scope:
      path: "civic.md"
    values:
      layout: entry
      EACCPFpath: "civic"
      overrideCommunityContributionForm: false

  # Facet-list pages: same layout, each just names which slice of
  # the directory data it shows. Add a new scope block here for each new facet.
  - scope:
      path: "people.md"
    values:
      layout: facet-list
      facet: "people"

  - scope:
      path: "places.md"
    values:
      layout: facet-list
      facet: "places"

<div id="details-modal" class="custom-modal" role="dialog" aria-modal="true" aria-labelledby="modal-heading">
    <div class="modal-content">
        <button type="button" class="modal-close" id="close-modal-btn" aria-label="Close">&times;</button>
        <h3 id="modal-heading">—</h3>
        <div id="modal-meta"></div>
        <div id="modal-body"></div>
        <div id="modal-link"></div>
        <strong class="modal-label">Location</strong>
        <div id="modal-location"></div>
        <div class="coords-box" id="modal-coords">—</div>
        <p class="modal-community" id="modal-community"></p>
    </div>
</div>
<script>
  // Every published entry, listed by Jekyll at build time, so the details
  // popup can link a record to its entry (scripts/map-common.js).
  window.ENTRY_FILES = [{% for f in site.static_files %}{% if f.path contains '/civic/' and f.extname == '.xml' %}"{{ f.basename }}",{% endif %}{% endfor %}];
</script>
